name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --webpack
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test.unit
      - run: npx prettier --check src docs README.md CONTRIBUTING.md
